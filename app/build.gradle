plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sunshine.accounting'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sunshine.technicalaccountant'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '3.5.2-visible-buttons'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.fragment:fragment:1.6.2'
    // Offline on-device camera barcode scanner. Does not send barcode data to servers.
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}

// Keep transitive Kotlin stdlib versions consistent across AndroidX dependencies.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin'
                && details.requested.name.startsWith('kotlin-stdlib')) {
            details.useVersion '1.8.20'
        }
    }
}
