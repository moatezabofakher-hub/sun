plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sunshine.accounting'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sunshine.accounting'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '3.0-signed-licenses'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.fragment:fragment:1.6.2'
}
