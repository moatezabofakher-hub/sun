<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#0b2538"><title>المحاسب التقني | المندوب</title>
<style>
:root{--navy:#0b2538;--teal:#0f8078;--pale:#e7f8f4;--ink:#1a2d3c;--muted:#698294;--shadow:0 5px 0 #bfd2d9,0 12px 25px #0d3e4c22}*{box-sizing:border-box}html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;font-family:system-ui,'Noto Sans Arabic',sans-serif;color:var(--ink);background:#f0f5f9}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.top{background:linear-gradient(135deg,#0b2538,#14485a);color:white;padding:16px 18px 18px;box-shadow:0 8px 18px #172e4033}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.mark{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;font-size:25px;background:linear-gradient(145deg,#61d8b9,#138c9a);box-shadow:inset 0 3px #ffffff66,0 5px 0 #064b54,0 12px 15px #0003}.top h1{font-size:17px;margin:0}.top p{font-size:11px;color:#c8e9ed;margin:4px 0}.tag{font-size:10px;background:#1b6876;padding:6px 9px;border-radius:999px;border:1px solid #4798a5}.wrap{max-width:680px;margin:0 auto;padding:16px 13px 100px}.hero{border-radius:22px;padding:20px;background:linear-gradient(150deg,#fff,#e8f5f8);border:1px solid white;box-shadow:var(--shadow);margin-bottom:17px}.hero h2{margin:0 0 8px;font-size:18px}.hero p{font-size:12px;color:var(--muted);line-height:1.75}.panel{background:linear-gradient(155deg,#fff,#f5fafc);border:1px solid #dae7ee;border-radius:21px;padding:16px;margin-bottom:16px;box-shadow:0 5px 0 #d2e1e8,0 12px 20px #0e455912}.panel h3{font-size:15px;margin:0 0 12px}.label{display:block;font-weight:700;font-size:12px;margin:11px 0 5px}.field{width:100%;min-height:45px;border:1px solid #c8d8e2;border-radius:13px;background:#fcfeff;padding:10px 12px;color:#243b4c;outline:none}.field:focus{border-color:#17a79d;box-shadow:0 0 0 3px #13bda71c}.primary{width:100%;border:1px solid #1ab7aa;border-radius:15px;min-height:47px;padding:10px;color:#fff;font-weight:800;background:linear-gradient(165deg,#2dc9b4,#078b83);box-shadow:0 5px 0 #05675e,0 10px 17px #06675d32;margin-top:12px}.secondary{width:100%;border:1px solid #b9d1e1;background:linear-gradient(160deg,#fff,#e4eef6);color:#19374b;font-weight:800;min-height:44px;border-radius:14px;box-shadow:0 4px 0 #bacbd7;margin-top:9px}.danger{background:#fff1f2;border:1px solid #fecaca;color:#9b252d}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1;min-width:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{min-height:115px;border:1px solid #d9e5ef;border-radius:19px;padding:16px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:right;background:linear-gradient(150deg,#fff,#ebf3f9);box-shadow:0 5px 0 #cbdbe6,0 12px 18px #12405616}.tile strong{font-size:14px}.tile small{color:#698294;font-size:11px}.glyph{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(150deg,#d4faff,#53bed4);font-size:24px;box-shadow:inset 0 2px #fff9,0 3px 0 #61a1b5}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{border:1px solid #d7e6e9;background:#f6fcfb;padding:12px 7px;border-radius:14px;text-align:center}.stat b{font-size:18px;display:block}.stat small{font-size:10px;color:#6b8492}.itemrow{border-bottom:1px dashed #9bbac5;padding:13px 0}.itemrow:last-child{border:0}.itemhead{display:flex;justify-content:space-between;gap:8px;font-weight:700}.itemhead small{font-size:11px;color:#67818f}.muted{color:#718593;font-size:12px}.tiny{font-size:11px;line-height:1.7;color:#6c8290}.pill{padding:4px 10px;background:#e2fbf4;color:#096b62;font-size:11px;border-radius:999px;font-weight:800}.pill.wait{background:#fff4db;color:#a36a11}.bottom{display:flex;gap:4px;position:fixed;bottom:0;left:0;right:0;padding:8px max(8px,calc((100% - 680px)/2));background:#fdfefe;border-top:1px solid #d6e3ea;box-shadow:0 -7px 20px #102c3c12;z-index:10}.bottom button{flex:1;border:0;background:none;border-radius:12px;min-height:54px;color:#557282;font-size:10px;font-weight:800;display:grid;place-items:center;gap:2px}.bottom button span{font-size:22px}.bottom button.active{background:#e3f6f2;color:#0a7d72}.toast{position:fixed;top:90px;left:15px;right:15px;z-index:20;margin:auto;max-width:600px;background:#173d49;color:#fff;padding:14px;border-radius:14px;box-shadow:0 10px 27px #0004;font-size:12px}.hide{display:none}.headback{background:none;border:1px solid #ffffff66;color:white;border-radius:12px;font-size:22px;padding:4px 12px}.ltr{direction:ltr;text-align:left;word-break:break-word}textarea{resize:vertical}button:focus-visible{outline:3px solid #f9c66c;outline-offset:2px}@media(max-width:340px){.tile{padding:12px 9px}.stats{grid-template-columns:1fr 1fr 1fr}.wrap{padding:12px 10px 100px}}
</style>
<script src="static/field-protocol.js"></script><script src="static/field-lan-crypto.js"></script><script src="static/agent.js" defer></script><link rel="stylesheet" href="static/agent-premium.css"></head>
<body>
<header class="top" id="agentHeader">
 <div class="brand">
  <button id="agentBack" class="headback hide" type="button" onclick="Agent.goBack()" aria-label="رجوع"><span aria-hidden="true">‹</span></button>
  <div class="mark" aria-hidden="true">🚚</div>
  <div class="brandcopy"><h1 id="agentScreenTitle">المحاسب التقني</h1><p id="agentScreenSubtitle">نسخة المندوب · توزيع ميداني</p></div>
  <button type="button" id="agentPrinterQuick" class="header-tool" onclick="Agent.navigate('printer')" aria-label="إعداد الطابعة">🖨</button>
 </div>
 <div class="headerbottom"><span class="tag" id="connectionTag">غير مفعّل</span><span id="agentVehicleHeader">مستودع السيارة</span></div>
</header>
<main id="screen" class="wrap"><div class="panel">جارٍ فتح بيانات المندوب…</div></main>
<nav id="bottom" class="bottom hide" aria-label="القائمة الرئيسية">
 <button onclick="Agent.navigate('home')" id="nav-home"><span>⌂</span>الرئيسية</button>
 <button onclick="Agent.startInvoice('sale')" id="nav-invoice"><span>▤</span>فاتورة</button>
 <button onclick="Agent.navigate('ops')" id="nav-ops"><span>☷</span>العمليات</button>
 <button onclick="Agent.navigate('sync')" id="nav-sync"><span>⇄</span>مزامنة</button>
 <button onclick="Agent.navigate('settings')" id="nav-settings"><span>⚙</span>الضبط</button>
</nav>
<div id="agentDialog" class="dialog-mask hide" role="presentation"><div class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h3 id="dialogTitle"></h3><p id="dialogMessage"></p><div class="dialog-actions"><button type="button" class="secondary" onclick="Agent.dismissDialog()">إلغاء</button><button type="button" id="dialogAccept" class="primary" onclick="Agent.acceptDialog()">تأكيد</button></div></div></div>
<div id="toast" class="toast hide" role="alert"></div>
<script defer src="static/agent-experience.js"></script>
<script defer src="static/agent-lan-ui.js"></script>
</body></html>
