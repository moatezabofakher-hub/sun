name: Build SAN SHINE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Repair Android project structure
        shell: bash
        run: |
          set -euo pipefail

          copy_if_missing() {
            dest="$1"
            shift
            if [[ -s "$dest" ]]; then
              return 0
            fi
            for source in "$@"; do
              if [[ -s "$source" ]]; then
                mkdir -p "$(dirname "$dest")"
                cp "$source" "$dest"
                echo "Restored $dest"
                return 0
              fi
            done
            echo "::error::Missing file: $dest"
            exit 1
          }

          copy_if_missing app/build.gradle \
            "build (1).gradle" \
            app/src/main/build.gradle

          copy_if_missing app/src/main/AndroidManifest.xml \
            AndroidManifest.xml

          copy_if_missing app/src/main/java/com/sunshine/accounting/MainActivity.java \
            MainActivity.java

          copy_if_missing app/src/main/assets/www/index.html \
            index.html

          copy_if_missing app/src/main/assets/www/static/icons.js \
            icons.js

          copy_if_missing app/src/main/assets/www/static/tailwind.css \
            tailwind.css

          copy_if_missing app/src/main/res/drawable/ic_launcher.xml \
            ic_launcher.xml

          copy_if_missing tests/check_project.py \
            check_project.py

          copy_if_missing tests/test_accounting.js \
            test_accounting.js

          copy_if_missing tests/test_signed_licenses.js \
            test_signed_licenses.js

          test -s build.gradle
          test -s settings.gradle
          test -s gradle.properties

          echo "Project files verified"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 35
        run: |
          sdkmanager --install \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android project
        run: python3 tests/check_project.py

      - name: Check JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path(
              'app/src/main/assets/www/index.html'
          ).read_text(encoding='utf-8')

          scripts = re.findall(
              r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',
              html,
              re.I
          )

          Path('/tmp/app.js').write_text(
              '\n'.join(scripts),
              encoding='utf-8'
          )
          PY

          node --check /tmp/app.js
          node --check app/src/main/assets/www/static/icons.js

      - name: Test accounting system
        run: node tests/test_accounting.js

      - name: Test license security
        run: node tests/test_signed_licenses.js

      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace \
            :app:assembleDebug 2>&1 | tee build-log.txt

      - name: Check APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAN-SHINE-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload error report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SAN-SHINE-Error-Log
          path: build-log.txt
          if-no-files-found: ignore
          retention-days: 7
