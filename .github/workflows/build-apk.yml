name: Tiqany Acc - Main Signed Release

on:
  workflow_dispatch:
  push:
    branches: ['feature/functional-icons-header', main, 'fix/scroll-behavior-144', 'feature/manager-finance-ui-from-152', 'feature/payroll-157']

permissions:
  contents: write

jobs:
  release:
    name: Audit, test, and create signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify resumable ledger transport and accounting under load
        run: node --test tests/peer-stream.test.cjs
      - name: Check weighted costs, settlements and cash shifts
        run: node --test tests/finance-operations.test.cjs
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate all application scripts
        run: node --test tests/release144-javascript-parse.test.cjs
      - name: Verify shareholder position and settings alignment
        run: node --test tests/release144-scroll-behavior.test.cjs
      - name: Static release audit
        run: python3 scripts/release_audit.py main
      - name: Run project tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/check_project.py
          python3 tests/test_scan_options_java.py
          node tests/test_field_import_atomic.js
          node tests/test_dual_currency_and_revisions_3544.js
          node tests/test_accounting.js
          node tests/test_invoice_date_price_visible_3564.js
          node tests/test_draft_invoice_balance_3555.js
          node tests/test_signed_licenses.js
          node tests/test_security_355.js
          node --test tests/warehouse-handover-123.test.js
          node --test tests/release125-device-notifications.test.js
          node tests/test_lan_sync_3528.js
          node tests/test_agent_parity_3527.js
          node tests/test_assembly_tiers_scope_3551.js
          node tests/test_bundle_grid_default_3553.js
          node tests/test_accounts_summary_3554.js
          node tests/test_live_items_3554.js
          node tests/test_transfer_destination_history_3554.js
      - name: Verify on-demand independent-account recovery and sky-blue delete button
        run: node --test tests/release127-profile-archive-visibility.test.js
      - name: Verify first run, complete reset, and conflict-aware recovery
        run: node --test tests/release128-company-lifecycle.test.js
      - name: Verify first-link direction, complete settings and source-only protection
        run: node --test tests/peer-first-link-source-only-129.test.js tests/peer-first-phone-to-empty-desktop-35118.test.js
      - name: Verify encrypted two-manager sync, paired settings and connection badges
        run: |
          node --test tests/release130-manager-two-phones.test.js
          node --test tests/shareholders-integration-133.test.js
          node --test tests/onboarding-shareholders-153.test.cjs tests/investor-profit-scope.test.cjs
          node --check app/src/main/assets/www/static/shareholders-integrated-133.js
          node --check app/src/main/assets/www/static/settings-revision-clock-133.js
      - name: Verify router rediscovery and dashboard-only navigation
        run: node --test tests/release137-manager-discovery.test.js tests/release137-home-only-dock.test.js
      - name: Verify explicit popup dismissal and fixed connection icons
        run: |
          node --test tests/release138-no-outside-dismiss.test.js
          node --test tests/release138-stable-header-links.test.js
      - name: Verify manual keyboard focus and no automatic IME
        run: node --test tests/release139-no-autokeyboard.test.js
      - name: Verify opening at top, stepwise Back and visible profits
        run: node --test tests/release140-navigation-profit.test.js
      - name: Verify restored protected shareholder edit, Back, and account persistence
        run: |
          node --test tests/release141-shareholder-edit-back.test.js
          node --test tests/shareholders-integration-133.test.js
      - name: Verify currency exchange engine and manager UI
        run: |
          node --test tests/currency-exchange-142.test.cjs
          node --test tests/currency-buy-sell-147.test.cjs
          node --test tests/currency-report-local-time-148.test.cjs
          node --test tests/release149-fx-security-controls.test.cjs
          node --test tests/release150-general-currency-rates.test.cjs
          node --check app/src/main/assets/www/static/ta-currency-exchange-core-142.js
          node --check app/src/main/assets/www/static/ta-currency-exchange-ui-142.js
          node --check app/src/main/assets/www/static/ta-report-local-date-148.js
          node --check app/src/main/assets/www/static/ta-fx-buy-sell-147.js
          node --check app/src/main/assets/www/static/field-protocol.js
      - name: Test manager-only v152 financial UI enhancements
        run: |
          set -euo pipefail
          node --check app/src/main/assets/www/static/ta-manager-enhancements-152.js
          node --check app/src/main/assets/www/static/ta-pricing-modes-152.js
          node --check app/src/main/assets/www/static/ta-print-customization-152.js
          node --check app/src/main/assets/www/static/ta-thermal-table-152.js
          node --test tests/manager-enhancements-152.test.cjs
          node --test tests/thermal-grid-152.test.cjs
      - name: Verify v152 standalone settings pages and draft Back guard
        run: node --test tests/settings-pages-152.test.cjs
      - name: Verify illustrated controls and header geometry
        run: |
          python -m pip install playwright==1.55.0
          python tests/check_ledger_identifiers.py app/src/main/assets/www
          python tests/check_peer_resume.py app/src/main/assets/www
          python tests/check_controls.py . manager
          python tests/check_foreign_notices.py app/src/main/assets/www manager
          python tests/check_cash_settings.py app/src/main/assets/www
          node --check app/src/main/assets/www/static/ta-themes-154.js
          python tests/check_themes_154.py app/src/main/assets/www
          python tests/check_legibility_155.py app/src/main/assets/www
          python tests/check_payroll.py app/src/main/assets/www main
          python tests/check_invoice_grid.py app/src/main/assets/www main
          python tests/check_entry_colors.py app/src/main/assets/www main
          python tests/check_pay_dates_leaves.py app/src/main/assets/www
      - name: Archive theme review screens
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: theme-review-manager
          path: ${{ runner.temp }}/theme-review/
          retention-days: 5
      - name: Build, sign, and verify app release APK
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.TA_KEYSTORE_BASE64 }}
          TA_SIGNING_STORE_PASSWORD: ${{ secrets.TA_STORE_PASSWORD }}
          TA_SIGNING_KEY_ALIAS: ${{ secrets.TA_KEY_ALIAS }}
          TA_SIGNING_KEY_PASSWORD: ${{ secrets.TA_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.TA_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEYSTORE_BASE64" || -z "$TA_SIGNING_STORE_PASSWORD" ||
                -z "$TA_SIGNING_KEY_ALIAS" || -z "$TA_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::Missing one or more TA signing secrets. Refusing to produce a Debug or unsigned release APK."
            exit 1
          fi
          umask 077
          export TA_SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/app-release.jks"
          trap 'rm -f "$TA_SIGNING_KEYSTORE_PATH"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$TA_SIGNING_KEYSTORE_PATH"
          test -s "$TA_SIGNING_KEYSTORE_PATH"

          gradle --no-daemon --console=plain :app:assembleRelease
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          package_info=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          grep -Fq "versionCode='162' versionName='3.5.162'" <<< "$package_info"
          grep -Fxq "application-label:'التقني الشامل'" <<< "$package_info"
          verifier="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$verifier" verify --verbose --print-certs "$apk"
          cert_digest=$("$verifier" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          [[ "$cert_digest" =~ ^[0-9a-fA-F]{64}$ ]] || { echo '::error::Could not read signing certificate SHA-256'; exit 1; }
          # Public SHA-256 fingerprint from verified 3.5.133 / 3.5.137 signed releases.
          # Reject accidental signing-key rotation: Android will refuse in-place updates.
          PINNED_CERT_SHA256="94d9512302e262c8a526651a6bc4c24e1797482dcdcb6f32a0638a8f958aaf9f"
          if [[ "${cert_digest,,}" != "$PINNED_CERT_SHA256" ]]; then
            echo "::error::APK signing certificate differs from the verified 3.5.133/134 releases. Do not tell users to uninstall their app."
            exit 1
          fi
          if [[ -n "$EXPECTED_CERT_SHA256" && "${cert_digest,,}" != "${EXPECTED_CERT_SHA256,,}" ]]; then
            echo '::error::Signing certificate does not match the configured certificate fingerprint.'
            exit 1
          fi
          mkdir -p output
          cp "$apk" "output/Tiqany-Acc-Main-3.5.162-RELEASE.apk"
          (cd output && sha256sum "Tiqany-Acc-Main-3.5.162-RELEASE.apk" > "Tiqany-Acc-Main-3.5.162-RELEASE.apk.sha256")
      - name: Upload signed app APK and checksum
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Tiqany-Acc-Main-3.5.162-RELEASE
          path: |
            output/Tiqany-Acc-Main-3.5.162-RELEASE.apk
            output/Tiqany-Acc-Main-3.5.162-RELEASE.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish isolated signed finance preview for direct download
        if: github.ref == 'refs/heads/feature/manager-finance-ui-from-152' || github.ref == 'refs/heads/feature/functional-icons-header'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk='output/Tiqany-Acc-Main-3.5.162-RELEASE.apk'
          checksum="${apk}.sha256"
          test -s "$apk" && test -s "$checksum"
          tag='tiqany-main-finance-preview-'"${GITHUB_SHA:0:10}"
          gh release create "$tag" "$apk" "$checksum" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'المحاسب التقني المدير الرئيسي - معاينة الإصدار 3.5.162' --notes 'تعديل نسب المساهمين مع الرصيد السالب واختيار مصدر أرباح المستثمر.' --prerelease
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq '.url'
      - name: Publish signed main branch artifact for two-theme update
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk='output/Tiqany-Acc-Main-3.5.162-RELEASE.apk'
          checksum="${apk}.sha256"
          test -s "$apk" && test -s "$checksum"
          tag='tiqany-main-themes-'"${GITHUB_SHA:0:10}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$checksum" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$apk" "$checksum" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'التقني الشامل Android 3.5.162' --notes 'تعديل نسب المساهمين مع الرصيد السالب واختيار مصدر أرباح المستثمر.' --prerelease
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq '.url'

      - name: Package complete tested project source
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/package_project_source.py "project-downloads/Tiqany-Acc-Manager-Source.zip"
      - name: Publish complete source ZIP in Actions Artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Tiqany-Acc-Manager-Project-Source
          path: project-downloads/Tiqany-Acc-Manager-Source.zip
          if-no-files-found: error
          retention-days: 90
