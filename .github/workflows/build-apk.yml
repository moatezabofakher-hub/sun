name: Build SAN SHINE Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'tests/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    name: Audit and Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configure compatible Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate project assets, JS, permissions and native bridge
        run: python3 tests/check_project.py

      - name: Verify JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/www/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, re.I)
          Path('/tmp/sunshine-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/sunshine-inline.js
          node --check app/src/main/assets/www/static/icons.js

      - name: Test core accounting calculations
        run: node tests/test_accounting.js

      - name: Verify RSA-signed offline licenses and reject forged codes
        run: node tests/test_signed_licenses.js

      - name: Build debug APK and collect diagnostic log
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build-log.txt

      - name: Verify APK exists and is not empty
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          echo '### Android APK generated' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download SAN-SHINE-Android-APK from Artifacts.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SAN-SHINE-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic log when build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SAN-SHINE-build-error-log
          path: build-log.txt
          if-no-files-found: ignore
          retention-days: 7
