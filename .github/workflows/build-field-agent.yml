name: Tiqany Acc - Agent Signed Release

on:
  workflow_dispatch:
  push:
    branches: ['feature/functional-icons-header', main, 'fix/scroll-behavior-144', 'feature/manager-finance-ui-from-152']
    paths:
      - 'field_agent/**'
      - 'tests/agent-posting-rights.test.cjs'
      - 'tests/employee-hotspot-ui.test.cjs'
      - 'tests/check_employee_hotspot_screen.py'
      - 'tests/EmployeeHotspotRegression.java'
      - 'tests/test_lan_android_thread_3529.py'
      - 'tests/check_controls.py'
      - 'tests/check_cash_settings.py'
      - 'tests/check_themes_154.py'
      - 'tests/check_legibility_155.py'
      - 'tests/test_lan_sync_3528.js'
      - 'app/src/main/assets/www/static/ta-fx-buy-sell-147.js'
      - 'tests/release138-no-outside-dismiss.test.js'
      - '.github/workflows/build-field-agent.yml'

permissions:
  contents: write

jobs:
  release:
    name: Audit, test, and create signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate all application scripts
        run: node --test tests/release144-javascript-parse.test.cjs
      - name: Verify shareholder position and settings alignment
        run: node --test tests/release144-scroll-behavior.test.cjs
      - name: Static release audit
        run: python3 scripts/release_audit.py main
      - name: Run project tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/test_field_protocol.js
          node tests/test_field_import_atomic.js
          node tests/test_agent_parity_3527.js
          node --test tests/warehouse-handover-123.test.js
          node --test tests/release125-device-notifications.test.js
          node tests/test_lan_sync_3528.js
          node tests/test_lan_agent_3528.js
          node --check field_agent/src/main/assets/www/static/agent.js
      - name: Test employee hotspot routes, socket source and pairing screens
        run: |
          python3 tests/test_lan_android_thread_3529.py
          node --test tests/employee-hotspot-ui.test.cjs
          node --test tests/employee-notice-details.test.cjs tests/test_agent_manager_notifications_35107.test.js
          node tests/test_auto_pairing_3534.js
          node tests/test_single_manager_exclusivity_3586.js
      - name: Verify employee popup backdrops
        run: node --test tests/release138-no-outside-dismiss.test.js
      - name: Verify keyboard remains closed until input is tapped
        run: node --test tests/release139-no-autokeyboard.test.js
      - name: Verify step-by-step employee Back and page scroll
        run: node --test tests/release140-navigation-profit.test.js
      - name: Verify employee currency exchange and cashbox
        run: |
          node --test tests/currency-exchange-142.test.cjs
          node --test tests/currency-buy-sell-147.test.cjs
          node --test tests/currency-report-local-time-148.test.cjs
          node --test tests/release149-fx-security-controls.test.cjs
          node --test tests/release150-general-currency-rates.test.cjs
          node --check field_agent/src/main/assets/www/static/ta-currency-exchange-agent-142.js
          node --check field_agent/src/main/assets/www/static/ta-fx-employee-147.js
          node --check field_agent/src/main/assets/www/static/ta-currency-exchange-agent-142.js
          node --check field_agent/src/main/assets/www/static/agent-cash-history.js
          node --check field_agent/src/main/assets/www/static/field-protocol.js
      - name: Assert employee release version matches manager (3.5.156)
        run: |
          grep -F "versionCode 156" field_agent/build.gradle
          grep -F "versionName '3.5.156'" field_agent/build.gradle

      - name: Verify employee v152 settings pages and unsaved draft guard
        run: node --test tests/settings-pages-152.test.cjs
      - name: Verify illustrated controls and header geometry
        run: |
          python -m pip install playwright==1.55.0
          python tests/check_controls.py . employee
          python tests/check_foreign_notices.py field_agent/src/main/assets/www agent
          python tests/check_employee_hotspot_screen.py
          python tests/check_cash_settings.py field_agent/src/main/assets/www
          node --check field_agent/src/main/assets/www/static/ta-themes-154.js
          node --test tests/agent-posting-rights.test.cjs
          python tests/check_themes_154.py field_agent/src/main/assets/www
          python tests/check_legibility_155.py field_agent/src/main/assets/www
      - name: Archive theme review screens
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: theme-review-employee
          path: ${{ runner.temp }}/theme-review/
          retention-days: 5
      - name: Build, sign, and verify field_agent release APK
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.TA_KEYSTORE_BASE64 }}
          TA_SIGNING_STORE_PASSWORD: ${{ secrets.TA_STORE_PASSWORD }}
          TA_SIGNING_KEY_ALIAS: ${{ secrets.TA_KEY_ALIAS }}
          TA_SIGNING_KEY_PASSWORD: ${{ secrets.TA_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.TA_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEYSTORE_BASE64" || -z "$TA_SIGNING_STORE_PASSWORD" ||
                -z "$TA_SIGNING_KEY_ALIAS" || -z "$TA_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::Missing one or more TA signing secrets. Refusing to produce a Debug or unsigned release APK."
            exit 1
          fi
          umask 077
          export TA_SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/field_agent-release.jks"
          trap 'rm -f "$TA_SIGNING_KEYSTORE_PATH"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$TA_SIGNING_KEYSTORE_PATH"
          test -s "$TA_SIGNING_KEYSTORE_PATH"

          gradle --no-daemon --console=plain :field_agent:assembleRelease
          apk="field_agent/build/outputs/apk/release/field_agent-release.apk"
          test -s "$apk"
          package_info=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          grep -Fq "versionCode='156' versionName='3.5.156'" <<< "$package_info"
          verifier="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$verifier" verify --verbose --print-certs "$apk"
          cert_digest=$("$verifier" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          [[ "$cert_digest" =~ ^[0-9a-fA-F]{64}$ ]] || { echo '::error::Could not read signing certificate SHA-256'; exit 1; }
          # Pin the signer from previously verified signed releases. Android
          # cannot update an installed package if this signing key rotates.
          PINNED_CERT_SHA256="94d9512302e262c8a526651a6bc4c24e1797482dcdcb6f32a0638a8f958aaf9f"
          if [[ "${cert_digest,,}" != "$PINNED_CERT_SHA256" ]]; then
            echo '::error::Unexpected APK signing certificate. Refusing release to protect in-place updates.'
            exit 1
          fi
          if [[ -n "$EXPECTED_CERT_SHA256" && "${cert_digest,,}" != "${EXPECTED_CERT_SHA256,,}" ]]; then
            echo '::error::Signing certificate does not match pinned certificate. Update aborted to protect install continuity.'
            exit 1
          fi
          mkdir -p output
          cp "$apk" "output/Tiqany-Acc-Agent-3.5.156-RELEASE.apk"
          (cd output && sha256sum "Tiqany-Acc-Agent-3.5.156-RELEASE.apk" > "Tiqany-Acc-Agent-3.5.156-RELEASE.apk.sha256")
      - name: Upload signed field_agent APK and checksum
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Tiqany-Acc-Agent-3.5.156-RELEASE
          path: |
            output/Tiqany-Acc-Agent-3.5.156-RELEASE.apk
            output/Tiqany-Acc-Agent-3.5.156-RELEASE.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish signed employee feature APK for direct download
        if: github.ref == 'refs/heads/feature/manager-finance-ui-from-152' || github.ref == 'refs/heads/feature/functional-icons-header'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk='output/Tiqany-Acc-Agent-3.5.156-RELEASE.apk'
          checksum="${apk}.sha256"
          test -s "$apk" && test -s "$checksum"
          tag='tiqany-agent-finance-preview-'"${GITHUB_SHA:0:10}"
          gh release create "$tag" "$apk" "$checksum" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'المحاسب التقني موظف البيع - معاينة الثيم ونقطة البيع' --notes 'تثبيت شريط سند الفاتورة وشريط الثيمات.' --prerelease
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq '.url'
      - name: Publish signed main branch artifact for two-theme update
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk='output/Tiqany-Acc-Agent-3.5.156-RELEASE.apk'
          checksum="${apk}.sha256"
          test -s "$apk" && test -s "$checksum"
          tag='tiqany-agent-themes-'"${GITHUB_SHA:0:10}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$checksum" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$apk" "$checksum" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'المحاسب التقني — موظف البيع 3.5.156' --notes 'تثبيت شريط سند الفاتورة وشريط الثيمات.' --prerelease
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq '.url'

      - name: Package complete tested project source
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/package_project_source.py "project-downloads/Tiqany-Acc-Employee-Source.zip"
      - name: Publish complete source ZIP in Actions Artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Tiqany-Acc-Employee-Project-Source
          path: project-downloads/Tiqany-Acc-Employee-Source.zip
          if-no-files-found: error
          retention-days: 90
