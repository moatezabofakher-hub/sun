name: Technical Accountant - Agent Signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test field protocol
        run: node tests/test_field_protocol.js

      - name: Build and verify signed release
        shell: bash
        env:
          TA_KEYSTORE_BASE64: ${{ secrets.TA_KEYSTORE_BASE64 }}
          TA_SIGNING_STORE_PASSWORD: ${{ secrets.TA_STORE_PASSWORD }}
          TA_SIGNING_KEY_ALIAS: ${{ secrets.TA_KEY_ALIAS }}
          TA_SIGNING_KEY_PASSWORD: ${{ secrets.TA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$TA_KEYSTORE_BASE64" ||
                -z "$TA_SIGNING_STORE_PASSWORD" ||
                -z "$TA_SIGNING_KEY_ALIAS" ||
                -z "$TA_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::One or more signing secrets are missing."
            exit 1
          fi

          umask 077
          export TA_SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/ta-release.keystore"
          trap 'rm -f "$TA_SIGNING_KEYSTORE_PATH"' EXIT
          printf '%s' "$TA_KEYSTORE_BASE64" |
            base64 --decode > "$TA_SIGNING_KEYSTORE_PATH"
          test -s "$TA_SIGNING_KEYSTORE_PATH"

          gradle --no-daemon --stacktrace :field_agent:assembleRelease

          apk="field_agent/build/outputs/apk/release/field_agent-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"

          cp "$apk" "TA-FIELD-AGENT-SIGNED.apk"

      - name: Publish signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TA-FIELD-AGENT-SIGNED
          path: TA-FIELD-AGENT-SIGNED.apk
          if-no-files-found: error
          retention-days: 30
